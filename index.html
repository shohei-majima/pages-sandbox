<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ongaku</title>
<style>
:root {
  --bg: #fafaf9; --fg: #1c1917; --mute: #78716c; --line: #e7e5e4; --accent: #e11d48;
  --font: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0c0a09; --fg: #e7e5e4; --mute: #a8a29e; --line: #292524; --accent: #fb7185; }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--fg); font: 13px/1.5 var(--font); }
main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
header { display: flex; align-items: baseline; justify-content: space-between; border-bottom: 1px solid var(--fg); padding-bottom: 8px; }
h1 { font-size: 18px; letter-spacing: .08em; }
.meta { color: var(--mute); font-family: var(--mono); font-size: 11px; }
.filters { display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.filters button { background: none; border: 0; color: var(--mute); font: inherit; cursor: pointer; padding: 2px 0; }
.filters button[aria-pressed="true"] { color: var(--fg); text-decoration: underline; text-underline-offset: 3px; }
.filters .sep { width: 1px; background: var(--line); }
h2 { font: 600 11px var(--mono); color: var(--mute); letter-spacing: .1em; padding: 18px 0 6px; }
ul { list-style: none; }
li a { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); color: inherit; text-decoration: none; }
li a:hover .title { text-decoration: underline; }
img { width: 56px; height: 56px; object-fit: cover; background: var(--line); display: block; }
.title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.artist { color: var(--mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.right { text-align: right; font-family: var(--mono); font-size: 11px; color: var(--mute); white-space: nowrap; }
.new::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-right: 6px; vertical-align: 1px; }
.empty { color: var(--mute); padding: 24px 0; }
</style>
</head>
<body>
<main>
  <header>
    <h1>ongaku</h1>
    <span class="meta" id="meta"></span>
  </header>
  <nav class="filters" id="types"></nav>
  <nav class="filters" id="artists"></nav>
  <div id="list"></div>
</main>
<script>
const NEW_DAYS = 60;
const kind = r => /- Single$/.test(r.collectionName) ? "Single" : /- EP$/.test(r.collectionName) ? "EP" : "Album";
const clean = s => s.replace(/ - (Single|EP)$/, "");
const art = u => u.replace("100x100bb", "200x200bb");
const state = { type: "すべて", artist: "すべて" };

fetch("releases.json").then(r => r.json()).then(data => {
  const now = Date.now();
  data.forEach(r => { r.kind = kind(r); r.isNew = (now - Date.parse(r.releaseDate)) / 864e5 < NEW_DAYS; });
  document.getElementById("meta").textContent = `${data.length} releases`;

  const artists = [...new Set(data.map(r => r.artistName.split(" & ")[0]))].sort();
  const buttons = (id, items, key) => {
    const el = document.getElementById(id);
    el.innerHTML = items.map(v => `<button aria-pressed="${state[key] === v}">${v}</button>`).join("");
    el.onclick = e => { if (e.target.tagName !== "BUTTON") return; state[key] = e.target.textContent; render(); };
  };

  function render() {
    buttons("types", ["すべて", "Album", "EP", "Single"], "type");
    buttons("artists", ["すべて", ...artists], "artist");
    const rows = data.filter(r =>
      (state.type === "すべて" || r.kind === state.type) &&
      (state.artist === "すべて" || r.artistName.includes(state.artist)));
    const byMonth = Map.groupBy(rows, r => r.releaseDate.slice(0, 7));
    document.getElementById("list").innerHTML = rows.length ? [...byMonth].map(([m, rs]) => `
      <h2>${m.replace("-", ".")}</h2>
      <ul>${rs.map(r => `
        <li><a href="${r.collectionViewUrl}" target="_blank" rel="noopener">
          <img src="${art(r.artworkUrl100)}" alt="" loading="lazy">
          <div><div class="title ${r.isNew ? "new" : ""}">${clean(r.collectionName)}</div><div class="artist">${r.artistName}</div></div>
          <div class="right">${r.kind}<br>${r.releaseDate.slice(5, 10).replace("-", "/")} · ${r.trackCount}曲</div>
        </a></li>`).join("")}</ul>`).join("") : `<p class="empty">該当なし</p>`;
  }
  render();
});
</script>
</body>
</html>
